name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # release-please maintains a "release PR" that accumulates the changelog + version bump from
  # conventional commits. Merging it tags the release and creates the GitHub Release; the build job
  # then builds and attaches the binaries.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # On a fresh release, build + attach the Windows artifacts via the reusable workflow (which is also
  # manually dispatchable to (re)build a tag's assets). A reusable-workflow call — not a `release`
  # event — because releases created by GITHUB_TOKEN do not trigger further workflows.
  build-artifacts:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    # The build needs no repository secrets of its own — GITHUB_TOKEN is passed to a reusable
    # workflow automatically. Nexus is published from the separate manual workflow, which is where
    # NEXUS_API_KEY is read, so nothing is forwarded from here.
    permissions:
      contents: write
      id-token: write # forwarded so release-build.yml can sign the provenance attestation
      attestations: write
