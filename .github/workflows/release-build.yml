name: Release build

# Builds the Windows release (GUI exe + cross-vendor Vulkan DLL). On a release it attaches the .7z to the
# GitHub release; on a release-touching PR it builds the same and uploads the .7z as an artifact (a
# dry-run, so a tag is never the first time the release build runs). Also dispatchable by hand.
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build and attach assets to"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach assets to (e.g. v0.1.0)"
        required: true
        type: string
      publish_nexus:
        description: "Also publish this build to Nexus Mods (manual republish of a tag)"
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - "scripts/**"
      - "cmd/studio/**"
      - "internal/backend/vulkan/**"
      - ".github/workflows/release-build.yml"

permissions:
  contents: write
  id-token: write # OIDC identity — proves to Sigstore which workflow/commit is signing
  attestations: write # publish the build-provenance attestation

jobs:
  windows:
    name: Build & attach (GUI + Vulkan)
    # The windows-2022 pin existed only for CUDA 12.8's cudafe++, which crashed on newer MSVC. With
    # CUDA out of the release the runner is free to track latest again.
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.tag || format('0.0.0-pr.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
      # Vulkan shim toolchain (glslang + headers + volk) assembled into third_party\vulkan so
      # build-vulkan.ps1 can compile fh6vk.dll; MSVC (set up above) compiles the shim + volk.
      - name: Set up Vulkan toolchain
        shell: pwsh
        run: .\scripts\setup-vulkan-ci.ps1
      - name: Build release (Vulkan + GUI)
        shell: pwsh
        run: .\scripts\build-release.ps1 -Version "$env:VERSION"
      # Archived from inside bin\ so the files sit flat (no bin\ folder on extract).
      - name: Package (7z)
        shell: pwsh
        run: |
          $archive = "fh6-paint-studio-${env:VERSION}-windows-x64.7z"
          Push-Location bin
          7z a -mx=9 "..\$archive" fh6-paint-studio.exe fh6vk.dll
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "7z failed ($code)" }
          "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Checksums
        shell: pwsh
        run: |
          $sum = (Get-FileHash $env:ARCHIVE -Algorithm SHA256).Hash.ToLower()
          # LF + no BOM so `sha256sum -c` accepts it on Unix (Out-File would write CRLF).
          [IO.File]::WriteAllText((Join-Path $PWD 'SHA256SUMS.txt'), "$sum  $env:ARCHIVE`n")
          Get-Content SHA256SUMS.txt
      # Skipped on fork PRs, where the GITHUB_TOKEN can't write id-token/attestations.
      - name: Attest build provenance
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.ARCHIVE }}
      - name: Upload artifact (PR dry-run)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: fh6-paint-studio-windows-x64
          path: |
            ${{ env.ARCHIVE }}
            SHA256SUMS.txt
      - name: Attach to the release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" "$env:ARCHIVE" SHA256SUMS.txt --clobber
      # Publish the same .7z to Nexus Mods as a new file version. Only on a genuine release
      # (push -> release-please -> this reusable workflow); manual dispatch and PR dry-runs never
      # touch Nexus, so re-attaching GitHub assets can't create a duplicate Nexus version. Runs last,
      # after the GitHub release is already populated, so a Nexus hiccup never blocks the release.
      - name: Nexus version string and changelog
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_nexus)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = '${{ inputs.tag }}'.TrimStart('v')
          "NEXUS_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # beta.10 of the action can POST the release notes to the mod's changelog endpoint, so the
          # notes land ON Nexus instead of only as a link out to GitHub. It needs mod_id alongside
          # changelog and REJECTS one without the other, so both stay empty unless NEXUS_MOD_ID is
          # configured -- publishing must never fail over a nice-to-have. Set the repository variable
          # to the numeric mod id (v3/games/:domain/mods/:game_scoped_id -> .id) to turn it on.
          $modId = '${{ vars.NEXUS_MOD_ID }}'
          $notes = ''
          if ($modId) {
            $notes = (gh release view '${{ inputs.tag }}' --json body --jq .body) -join "`n"
            if (-not $notes) { $modId = '' } # nothing to say -> skip the endpoint rather than post an empty entry
          }
          "NEXUS_MOD_ID=$modId" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # Multi-line values need the delimiter form; the marker is one the notes cannot contain.
          $eof = "NEXUSNOTES_$([guid]::NewGuid().ToString('N'))"
          "NEXUS_CHANGELOG<<$eof" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $notes | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $eof | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish to Nexus Mods
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_nexus)
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUS_API_KEY }}
          file_id: "7536650"
          filename: ${{ env.ARCHIVE }}
          version: ${{ env.NEXUS_VERSION }}
          display_name: ${{ env.NEXUS_VERSION }}
          description: "Changelog: https://github.com/HorizonRepublic/fh6-paint-studio/releases/tag/${{ inputs.tag }}"
          mod_id: ${{ env.NEXUS_MOD_ID }}
          changelog: ${{ env.NEXUS_CHANGELOG }}
          # Keep the mod page's version in step with the file that was just published, so the Nexus
          # header stops lagging a release behind.
          update_mod_version: true
          archive_existing_version: true
          # Standalone .exe tool, not a mod-manager mod: make the new file the primary download and
          # hide the Vortex/mod-manager download button so users always grab the manual archive.
          primary_mod_manager_download: true
          allow_mod_manager_download: false
