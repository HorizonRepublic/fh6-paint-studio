name: Release build

# Builds the Windows release: the Flutter client, the engine service and the cross-vendor Vulkan DLL.
# On a release it attaches the .zip to the GitHub release; on a release-touching PR it builds the same
# and uploads the .zip as an artifact (a dry-run, so a tag is never the first time the release build
# runs). Also dispatchable by hand.
#
# The app is now the Flutter client talking to engined over a loopback socket, so the release is a
# FOLDER, not two loose files: the runner needs its data\ directory beside it. The zip therefore
# carries one top-level folder and the extract step is "unzip anywhere and run the exe inside".
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build and attach assets to"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach assets to (e.g. v0.1.0)"
        required: true
        type: string
      publish_nexus:
        description: "Also publish this build to Nexus Mods (manual republish of a tag)"
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - "scripts/**"
      - "client/**"
      - "cmd/engined/**"
      - "internal/backend/vulkan/**"
      - ".github/workflows/release-build.yml"

permissions:
  contents: write
  id-token: write # OIDC identity — proves to Sigstore which workflow/commit is signing
  attestations: write # publish the build-provenance attestation

jobs:
  windows:
    name: Build & attach (client + engine + Vulkan)
    # The windows-2022 pin existed only for CUDA 12.8's cudafe++, which crashed on newer MSVC. With
    # CUDA out of the release the runner is free to track latest again.
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.tag || format('0.0.0-pr.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
      # The client is Flutter. Pinned to stable rather than a version: the app uses nothing newer
      # than the current stable API, and pinning a patch release means a broken build the day it is
      # yanked. The cache is worth having — a cold Flutter SDK download is minutes.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Vulkan shim toolchain (glslang + headers + volk) assembled into third_party\vulkan so
      # build-vulkan.ps1 can compile fh6vk.dll; MSVC (set up above) compiles the shim + volk.
      - name: Set up Vulkan toolchain
        shell: pwsh
        run: .\scripts\setup-vulkan-ci.ps1
      - name: Build release (Vulkan + engine + client)
        shell: pwsh
        run: .\scripts\build-client-release.ps1 -Version "$env:VERSION" -Out release
      # ZIP, not 7z: Windows opens it without a third-party tool on every supported version, and the
      # code-signing service reads inside a zip container. The 7z CLI is still the zipper (-tzip) —
      # it is already on the runner and compresses better than Compress-Archive — but the output is
      # an ordinary deflate zip.
      #
      # Archived WITH its folder, unlike the old two-file release: the client will not start without
      # its data\ directory beside it, and a flat archive invites extracting into a downloads folder
      # where those files scatter.
      - name: Package (zip)
        shell: pwsh
        run: |
          $archive = "fh6-paint-studio-${env:VERSION}-windows-x64.zip"
          Push-Location release
          7z a -tzip -mx=9 "..\$archive" fh6-paint-studio
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "zip failed ($code)" }
          # A second asset under a VERSION-FREE name. GitHub's
          # releases/latest/download/<asset> endpoint resolves the release but not the filename, so a
          # versioned name alone gives no stable URL — every consumer that fetches automatically
          # (code signing, mirrors, install scripts) would have to scrape the release JSON first.
          $stable = "fh6-paint-studio-windows-x64.zip"
          Copy-Item $archive $stable -Force
          "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "STABLE=$stable"   | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Checksums
        shell: pwsh
        run: |
          # Both assets are listed: they are byte-identical, but a verifier checks the name it
          # actually downloaded, and a missing line reads as a failed check rather than a note.
          $lines = @($env:ARCHIVE, $env:STABLE) | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $_"
          }
          # LF + no BOM so `sha256sum -c` accepts it on Unix (Out-File would write CRLF).
          [IO.File]::WriteAllText((Join-Path $PWD 'SHA256SUMS.txt'), ($lines -join "`n") + "`n")
          Get-Content SHA256SUMS.txt
      # Skipped on fork PRs, where the GITHUB_TOKEN can't write id-token/attestations.
      - name: Attest build provenance
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ env.ARCHIVE }}
            ${{ env.STABLE }}
      - name: Upload artifact (PR dry-run)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: fh6-paint-studio-windows-x64
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.STABLE }}
            SHA256SUMS.txt
      - name: Attach to the release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" "$env:ARCHIVE" "$env:STABLE" SHA256SUMS.txt --clobber
      # Publish the same .zip to Nexus Mods as a new file version. Only on a genuine release
      # (push -> release-please -> this reusable workflow); manual dispatch and PR dry-runs never
      # touch Nexus, so re-attaching GitHub assets can't create a duplicate Nexus version. Runs last,
      # after the GitHub release is already populated, so a Nexus hiccup never blocks the release.
      - name: Nexus version string
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_nexus)
        shell: pwsh
        run: |
          $v = '${{ inputs.tag }}'.TrimStart('v')
          "NEXUS_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish to Nexus Mods
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_nexus)
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUS_API_KEY }}
          file_id: "7536650"
          filename: ${{ env.ARCHIVE }}
          version: ${{ env.NEXUS_VERSION }}
          display_name: ${{ env.NEXUS_VERSION }}
          # The changelog is NOT posted to the mod page. Release notes are generated from every
          # commit since the last tag, and on the way to a real release that is a wall of text
          # nobody reads on a Nexus page — the link to the GitHub release is the honest amount of
          # detail for a mod listing.
          description: "Changelog: https://github.com/HorizonRepublic/fh6-paint-studio/releases/tag/${{ inputs.tag }}"
          # Keep the mod page's version in step with the file that was just published, so the Nexus
          # header stops lagging a release behind.
          update_mod_version: true
          archive_existing_version: true
          # Standalone tool, not a mod-manager mod: make the new file the primary download and hide
          # the Vortex/mod-manager download button so users always grab the manual archive.
          primary_mod_manager_download: true
          allow_mod_manager_download: false
