name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Everything runs on Windows: Gio (the GUI) is CGO-free on Windows (Direct3D / Win32 via
  # x/sys/windows), whereas on Linux it needs system libraries (wayland, xkbcommon) + cgo. Windows
  # also matches the primary target and the local dev environment, so `go test ./...` is apples-to-apples.
  ci:
    name: Vet, test & build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./... -count=1
      - name: Build (CPU)
        run: |
          go build ./cmd/studio
          go build ./cmd/fh6paint
      # CUDA-tagged build needs NO toolkit/DLL: the GPU backend is loaded via syscall at runtime, so
      # this only verifies the cuda-tagged Go compiles. (The real DLL is built in release.yml.)
      - name: Build (CUDA-tagged)
        run: |
          go build -tags cuda ./cmd/studio
          go build -tags cuda ./cmd/fh6paint
