name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Everything runs on Windows: Gio (the GUI) is CGO-free on Windows (Direct3D / Win32 via
  # x/sys/windows), whereas on Linux it needs system libraries (wayland, xkbcommon) + cgo. Windows
  # also matches the primary target and the local dev environment, so `go test ./...` is apples-to-apples.
  ci:
    name: Vet, test & build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./... -count=1
      - name: Build (CPU)
        run: |
          go build ./cmd/studio
          go build ./cmd/fh6paint
      # CUDA-tagged build needs NO toolkit/DLL: the GPU backend is loaded via syscall at runtime, so
      # this only verifies the cuda-tagged Go compiles. (The real DLL is built in release.yml.)
      - name: Build (CUDA-tagged)
        run: |
          go build -tags cuda ./cmd/studio
          go build -tags cuda ./cmd/fh6paint
      # allgpu = CUDA + Vulkan auto-select + the in-app engine picker. Like the cuda build, both shims
      # load via syscall at runtime, so this only verifies the allgpu-tagged Go compiles (no toolchains).
      - name: Build (allgpu-tagged)
        run: |
          go build -tags allgpu ./cmd/studio
          go build -tags allgpu ./cmd/fh6paint
      # The studio half of the release build (version resource + ldflags), no CUDA toolkit needed.
      - name: Release smoke (version resource + studio exe)
        shell: pwsh
        run: |
          ./scripts/gen-winres.ps1 -Version 0.0.0-ci
          go build -tags cuda -trimpath -ldflags "-s -w -H windowsgui -X main.version=0.0.0-ci" -o bin/fh6-paint-studio.exe ./cmd/studio
          $vi = (Get-Item bin/fh6-paint-studio.exe).VersionInfo
          if ($vi.CompanyName -ne 'Horizon Republic') { throw "version resource missing: CompanyName='$($vi.CompanyName)'" }
          Write-Host "release smoke OK: $($vi.ProductName) $($vi.FileVersion) ($($vi.CompanyName))"
