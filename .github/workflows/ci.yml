name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Everything runs on Windows: Gio (the GUI) is CGO-free on Windows (Direct3D / Win32 via
  # x/sys/windows), whereas on Linux it needs system libraries (wayland, xkbcommon) + cgo. Windows
  # also matches the primary target and the local dev environment, so `go test ./...` is apples-to-apples.
  ci:
    name: Vet, test & build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./... -count=1
      # Backend-tagged code is NOT covered by the untagged vet/test above (the engine, runner and
      # backend tests all sit behind build tags), so vet it explicitly. Runners have no GPU and no
      # shim DLL, so the tagged TESTS cannot run here — vet + build is the honest ceiling on CI, and
      # the real gate is `go test ./...` on a machine with a GPU (Vulkan is the only backend, no build tags).
      - name: Vet (Vulkan-tagged)
        run: go vet ./...
      - name: Build (no backend)
        run: |
          go build ./cmd/studio
          go build ./cmd/fh6paint
          go build ./cmd/engined
      # Vulkan is the shipped backend. The shim loads via syscall at runtime, so this verifies the
      # vulkan-tagged Go compiles; the real fh6vk.dll is built in release-build.yml.
      - name: Build (Vulkan-tagged)
        run: |
          go build ./cmd/studio
          go build ./cmd/fh6paint
          go build ./cmd/engined
      # The studio half of the release build (version resource + ldflags), no GPU toolchain needed.
      - name: Release smoke (version resource + studio exe)
        shell: pwsh
        run: |
          ./scripts/gen-winres.ps1 -Version 0.0.0-ci
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=0.0.0-ci" -o bin/fh6-paint-studio.exe ./cmd/studio
          go build -trimpath -ldflags "-s -w -H windowsgui" -o bin/engined.exe ./cmd/engined
          foreach ($exe in 'bin/fh6-paint-studio.exe', 'bin/engined.exe') {
            $vi = (Get-Item $exe).VersionInfo
            # An unsigned binary with no company, no description and no version is the shape
            # heuristic scanners are most suspicious of, and the engine legitimately writes to
            # another process's memory. Losing the resource silently is not something to find out
            # from a user's antivirus.
            if ($vi.CompanyName -ne 'Horizon Republic') { throw "version resource missing on ${exe}: CompanyName='$($vi.CompanyName)'" }
            Write-Host "release smoke OK: $exe -- $($vi.ProductName) $($vi.FileVersion) ($($vi.CompanyName))"
          }

  # The client is a separate toolchain, so it is a separate job: a Flutter failure should read as a
  # Flutter failure, and neither half should wait on the other.
  client:
    name: Analyze & test (Flutter client)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      # Same exact pin as release-build.yml — CI must exercise the SDK the release ships, or a
      # green check validates a runtime users never receive.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - run: flutter pub get
      # Warnings fail the build. The analyzer is the only static check this half has -- there is no
      # vet, no compiler that rejects an unused field -- so letting warnings accumulate would leave
      # it with nothing.
      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter test
      # Compiling the Windows runner is what catches the half of the client that Dart cannot see:
      # the C++ that owns the window, the caption hit test and the method channel.
      - run: flutter build windows --release
